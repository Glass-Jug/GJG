
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>w</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        a {
            color: #0969da;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        li {
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <h1>━━━━━━━━━━━━</h1>
    <ul id="files"></ul>
    <script>
        const files = [
            "EGMversionlist.html",
			"EGM-soundtrack-videoclip.mp4",
			"EGM-coverart.png",
			"EGM-bannerart.png",
			"EGM-keyart.png",
			"SUN.png",
			"MOON.png",
			"Crystal.png"
        ];

        const list = document.getElementById("files");

        files.forEach(file => {
            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = file.split("/")
                .map(encodeURIComponent)
                .join("/");

            a.textContent = file;

            li.appendChild(a);
            list.appendChild(li);
        });
    </script>
	<h1>━━━━━━━━━━━━</h1>
</body>
</html>
