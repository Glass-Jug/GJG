<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epilepson</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <video id="video" loop playsinline>
    <source src="Epilepson.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("video");

    document.addEventListener("click", () => {
      video.play();
    }, { once: true });

    document.addEventListener("touchstart", () => {
      video.play();
    }, { once: true });
  </script>
</body>
  
</html>
